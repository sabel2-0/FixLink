<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="transparent"/>
  <!-- phone body -->
  <rect x="140" y="30" width="120" height="220" rx="20" fill="#1C1C1E"/>
  <rect x="148" y="38" width="104" height="204" rx="14" fill="#F2F2F7"/>
  <!-- notch -->
  <rect x="180" y="44" width="40" height="6" rx="3" fill="#1C1C1E"/>
  <!-- chat bubble 1 (received) -->
  <rect x="158" y="70" width="70" height="30" rx="8" fill="#E5E5EA"/>
  <rect x="166" y="80" width="50" height="4" rx="2" fill="#8E8E93"/>
  <rect x="166" y="88" width="40" height="4" rx="2" fill="#8E8E93"/>
  <!-- chat bubble 2 (sent) -->
  <rect x="180" y="112" width="64" height="30" rx="8" fill="#0A84FF"/>
  <rect x="188" y="122" width="46" height="4" rx="2" fill="#fff" opacity="0.9"/>
  <rect x="188" y="130" width="34" height="4" rx="2" fill="#fff" opacity="0.6"/>
  <!-- chat bubble 3 -->
  <rect x="158" y="154" width="55" height="26" rx="8" fill="#E5E5EA"/>
  <rect x="166" y="163" width="38" height="4" rx="2" fill="#8E8E93"/>
  <!-- input bar -->
  <rect x="160" y="210" width="80" height="20" rx="10" fill="#E5E5EA"/>
  <circle cx="230" cy="220" r="10" fill="#0A84FF"/>
</svg>