  <rect x="60" y="40" width="280" height="220" rx="16" fill="#E5F0FF"/>
  <!-- roads -->
  <line x1="100" y1="40" x2="100" y2="260" stroke="#fff" stroke-width="8"/>
  <line x1="200" y1="40" x2="200" y2="260" stroke="#fff" stroke-width="6"/>
  <line x1="280" y1="40" x2="280" y2="260" stroke="#fff" stroke-width="6"/>
  <line x1="60" y1="120" x2="340" y2="120" stroke="#fff" stroke-width="8"/>
  <line x1="60" y1="200" x2="340" y2="200" stroke="#fff" stroke-width="6"/>
  <!-- pins -->
  <g transform="translate(140,100)">
