  </g>
  <g transform="translate(180,210)">
    <path d="M0 0 C-12 0 -18 8 -18 16 C-18 26 0 40 0 40 C0 40 18 26 18 16 C18 8 12 0 0 0 Z" fill="#3A3A3C"/>
    <circle cx="0" cy="16" r="6" fill="#fff"/>
